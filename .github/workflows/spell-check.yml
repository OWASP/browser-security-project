name: Spell Check Markdown

on:
  push:
    branches:
      - main
    paths:
      - '*.md'
      - '**/en/*.md'
  pull_request:
    branches:
      - main
    paths:
      - '*.md'
      - '**/en/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install -g cspell

      - name: Get changed files (PR only)
        if: github.event_name == 'pull_request'
        id: files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            bsvs/**/en/**/*.md
            *.md
          separator: '\n'

      - name: Run cspell on changed files (PR)
        if: github.event_name == 'pull_request' && steps.files.outputs.any_changed == 'true'
        run: |
          files_string="${{ steps.files.outputs.all_changed_files }}"
          files_string="${files_string//\\n/$'\n'}"
          files=()
          while IFS= read -r file; do
            [ -n "$file" ] && files+=("$file")
          done <<< "$files_string"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files to check."
            exit 0
          fi
          cspell --config .github/workflows/config/cspell.json "${files[@]}"

      - name: Run cspell on all markdown files (push to main or manual)
        if: github.event_name != 'pull_request'
        run: |
          cspell --config .github/workflows/config/cspell.json "bsvs/**/en/**/*.md" "*.md"
